# Local categorization rules for monarch_categorize.py.
# Checked top to bottom; the first rule whose every `match` clause holds wins.
# Keep this file in the same spirit as Monarch's own rules (merchant + amount + account criteria,
# category action) so a rule can be moved into Monarch later without translation.
#
# match clauses (all optional, all case-insensitive):
#   merchant:  { contains | equals | starts_with | ends_with | regex: "text" }   # the Monarch merchant name
#   statement: { contains | equals | starts_with | ends_with | regex: "text" }   # the bank's raw description
#              either may be a list of such specs, meaning any-of (Monarch's "merchant is X or Y")
#   amount:    { is_expense: true|false, equals: 12.34, between: [lo, hi], greater_than: x, less_than: y }
#   account:   { contains: "8206" }        # matches the Monarch account display name
# set:
#   category:  "Name as shown in Monarch"  # required
# confidence: 0.95                         # optional, default 0.95; below the AI threshold the model is still asked

rules:
  - name: Discover payment arriving by wire is a transfer
    match:
      merchant: { contains: "Discover" }
      statement: { contains: "wire" }
      amount: { is_expense: false }
    set:
      category: Transfer
    confidence: 0.95

  - name: Money in from Yumyums Kitchen (Mercury business) is business income
    match:
      statement: { contains: "Yumyums Kitchen" }
      amount: { is_expense: false }
    set:
      category: Yumyums
    confidence: 0.95

  - name: Money sent out of Mercury Personal in the owner's name is a transfer
    match:
      merchant: { contains: "Jamal Cole" }
      statement: { contains: "via mercury.com" }
      amount: { is_expense: true }
    set:
      category: Transfer
    confidence: 0.95

  - name: Payment into the personal loan (...0621) is a loan repayment
    match:
      account: { contains: "0621" }
      statement: { contains: "Origination Payment" }
    set:
      category: Loan Repayment

  - name: Monthly 615.64 to Lafayette FCU from Capital One is the personal loan payment
    match:
      merchant: { contains: "Lafayette FCU" }
      account: { contains: "4354" }
      amount: { is_expense: true, equals: 615.64 }
    set:
      category: Loan Repayment
    confidence: 0.95
    confidence: 0.95

# Transfer pairing. A deposit whose bank text says "wire" or "transfer" names no sender (Capital One's
# "Wire Deposit" can come from Mercury business or Mercury personal), so the categorizer looks for the
# other side of the move instead: same amount, opposite sign, another account, within window_days.
#   - found in another Monarch account      -> transfer_category   (a move between the household's own accounts)
#   - found leaving a Mercury business account (Mercury API, MERCURY_API_TOKEN) -> mercury_business.category
#   - neither                                -> no verdict; the row falls through to rules / history / AI
# Every key is optional (defaults shown); `pairing: false` turns the step off; --no-pairing skips one run.
pairing:
  words: [wire, transfer, xfer, "own account", mercury]
  window_days: 2
  transfer_category: Transfer
  mercury_business:
    category: Yumyums
    accounts: []        # Mercury API account ids; empty = the accounts merchants.yaml reconciles (4613, 5396, 7818)
