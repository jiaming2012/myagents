# =============================================================
# Payments (recurring bills)
# =============================================================
# Each payment has:
#   name:             display name (matches Zoho Calendar event title prefix)
#   amount:           monthly amount. For autopay_type: min this is the LAST OBSERVED
#                     minimum (the forecast never draws the full card balance for a min).
#                     For autopay_type: full it is ignored when the card balance is live.
#   day_of_month:     the day the debit POSTS TO THE BANK ACCOUNT, not the card's due
#                     date. Card autopay lands at the bank 1-4 days after the card
#                     shows it (Amex 16th -> bank 17th). The forecast exists to check
#                     bank funding, so the bank-side date is the one that matters.
#   funding_account:  references accounts[].id above. A credit card here means the
#                     bill is charged to that card (no bank draw); the card's own
#                     payment entry carries it to the bank.
#   pays_account:     for card/loan payments, the accounts[].id being paid down
#   autopay:          true | false | null (needs review)
#   autopay_type:     full | min | null
#   category:         personal | business
#   zoho_match:       title prefix in Zoho Calendar (for automated matching)
#
# Dates and amounts below were reconciled against 120 days of Monarch history
# for Recurring ACH 4354 on 2026-10-17 (Jun 20 - Oct 16, 2026).

