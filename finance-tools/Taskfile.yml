version: "3"

tasks:
  install:
    desc: Install Python dependencies
    cmds:
      - pip install -r requirements.txt

  payments:
    desc: List upcoming payment events (default 7 days)
    cmds:
      - python zoho_calendar_payments.py {{.CLI_ARGS}}

  payments:today:
    desc: List today's payment events
    cmds:
      - python zoho_calendar_payments.py --days 1

  payments:month:
    desc: List payment events for the next 30 days
    cmds:
      - python zoho_calendar_payments.py --days 30

  bill-map:
    desc: Show bill-to-account mapping with balances (default 30 days)
    cmds:
      - python zoho_calendar_payments.py --bill-map {{.CLI_ARGS}}

  bill-map:month:
    desc: Bill mapping for next 30 days
    cmds:
      - python zoho_calendar_payments.py --bill-map --days 30

  report:
    desc: Weekly coverage report (all windows)
    cmds:
      - python coverage_report.py {{.CLI_ARGS}}

  report:week:
    desc: Coverage report for next 7 days only
    cmds:
      - python coverage_report.py --days 7

  forecast:
    desc: Payment forecast (default 30 days)
    cmds:
      - python payment_forecast.py {{.CLI_ARGS}}

  forecast:week:
    desc: Payment forecast for next 7 days
    cmds:
      - python payment_forecast.py --days 7

  forecast:month:
    desc: Payment forecast for next 30 days
    cmds:
      - python payment_forecast.py --days 30

  week:
    desc: "THE weekly question: what leaves each bank account in the next 7 days, and does it clear? (timeline + per-account funding verdict + card charges)"
    cmds:
      - python payment_forecast.py --days 7 --timeline {{.CLI_ARGS}}

  due:
    desc: "Everything due in the next 7 days from payments.yaml -- deterministic, no logins"
    cmds:
      - python payment_forecast.py --days 7 --no-balances --timeline

  due:month:
    desc: "Everything due in the next 30 days from payments.yaml -- deterministic, no logins"
    cmds:
      - python payment_forecast.py --days 30 --no-balances --timeline

  gaps:
    desc: "Registry gap check: liabilities without payment entries, Monarch/Xero/Zoho drift, source outages"
    cmds:
      - python registry_gaps.py {{.CLI_ARGS}}

  gaps:offline:
    desc: Registry-only gap check (no network)
    cmds:
      - python registry_gaps.py --offline

  gaps:personal:
    desc: "Gap check for personal accounts/payments only (Monarch + Zoho; never touches Xero)"
    cmds:
      - python registry_gaps.py --category personal {{.CLI_ARGS}}

  gaps:business:
    desc: "Gap check for business accounts/payments only (Xero + Zoho; Monarch only if a business account maps to it)"
    cmds:
      - python registry_gaps.py --category business {{.CLI_ARGS}}

  forecast:email:
    desc: Email forecast summary (default 30 days)
    cmds:
      - python payment_forecast.py --email-summary {{.CLI_ARGS}}

  forecast:email-weekly:
    desc: Email forecast summary for next 7 days
    cmds:
      - python payment_forecast.py --email-summary --days 7

  balances:
    desc: Show Monarch Money account balances
    cmds:
      - python monarch_balances.py {{.CLI_ARGS}}

  balances:login:
    desc: Re-login to Monarch Money (interactive)
    cmds:
      - python monarch_balances.py --login

  xero:auth:
    desc: Run Xero OAuth flow then copy token to this project
    cmds:
      - echo "Starting Xero OAuth server..."
      - echo "1. Visit http://localhost:9091/login in your browser"
      - echo "2. Authorize the app on Xero"
      - echo "3. Once you see 'Token saved', press Ctrl+C to stop the server"
      - echo ""
      - cmd: python /Users/jamal/projects/yumyums/accounting/xero/app.py
        ignore_error: true
      - cp /Users/jamal/projects/yumyums/accounting/xero/.xero_token.json .xero_token.json
      - echo "Token copied. Run 'task forecast' to verify business balances load."

  audit:
    desc: Transaction coverage audit (default 7 days)
    cmds:
      - python transaction_audit.py {{.CLI_ARGS}}

  precode:
    desc: "Dry-run Mercury -> Xero pre-coding (spends + transfers, merchants.yaml)"
    cmds:
      - python mercury_precode.py {{.CLI_ARGS}}

  precode:apply:
    desc: Apply Mercury -> Xero pre-coding (creates transactions)
    cmds:
      - python mercury_precode.py --apply {{.CLI_ARGS}}

  zoho:toast-dump:
    desc: "Dump toast_xero's previewed payout splits for 2026 to .toast_preview_2026.json"
    cmds:
      - python toast_preview_dump.py 2026-01-01 {{.END | default "2026-12-31"}} .toast_preview_2026.json

  zoho:recon:
    desc: "Dry-run Mercury -> Zoho Books reconciliation (docs/zoho-books-recon-plan.md)"
    cmds:
      - python zoho_books_recon.py --toast .toast_preview_2026.json {{.CLI_ARGS}}

  zoho:recon:apply:
    desc: "Apply Mercury -> Zoho Books reconciliation (resumes from .zoho_recon_state.json; stops at the 1,000/day API cap)"
    cmds:
      - python zoho_books_recon.py --apply --toast .toast_preview_2026.json {{.CLI_ARGS}}

  zoho:rules:
    desc: Create Zoho bank rules from merchants.yaml (dry run unless -- --apply)
    cmds:
      - python zoho_books_recon.py --rules {{.CLI_ARGS}}

  zoho:reconcile:
    desc: Create monthly Zoho reconciliation records against Mercury month-end balances (dry run unless -- --apply)
    cmds:
      - python zoho_books_recon.py --reconcile {{.CLI_ARGS}}

  zoho:boa:
    desc: "Dry-run the feed-only accounts (BoA, LFCU, Bluevine, Chase Ink, Wells Fargo): classify uncategorized lines (docs/zoho-books-handoff-boa.md)"
    cmds:
      - python zoho_books_recon.py --feed-only {{.CLI_ARGS}}

  zoho:boa:apply:
    desc: "Post the feed-only accounts' lines to Zoho (resumes from .zoho_recon_state.json)"
    cmds:
      - python zoho_books_recon.py --feed-only --apply {{.CLI_ARGS}}

  zoho:boa:reconcile:
    desc: "Month-end records for the feed-only accounts from closing_balances.yaml statement balances (dry run unless -- --apply)"
    cmds:
      - python zoho_books_recon.py --feed-only --reconcile {{.CLI_ARGS}}

  zoho:boa:rules:
    desc: "Bank rules on the live feed-only accounts for the boa_merchants patterns (dry run unless -- --apply)"
    cmds:
      - python zoho_books_recon.py --feed-only --rules {{.CLI_ARGS}}

  zoho:sheet:auth:
    desc: "One-time: exchange a Zoho grant code (Self Client, scope ZohoSheet.dataAPI.UPDATE,ZohoSheet.dataAPI.READ) for ZOHO_SHEET_REFRESH_TOKEN (docs/zoho-sheet-bills.md)"
    cmds:
      - python zoho_sheet.py --auth {{.CLI_ARGS}}

  zoho:sheet:list:
    desc: "List Zoho Sheet workbooks visible to the Sheet token"
    cmds:
      - python zoho_sheet.py --list

  zoho:sheet:bills:
    desc: "Create the 'Bills' Zoho Sheet workbook from the Google Sheets export in exports/ (all 9 tabs, formulas and formatting)"
    cmds:
      - python zoho_sheet.py --upload exports/bills-google-sheet-2026-08-17.xlsx --name Bills

  zoho:sheet:upload:
    desc: "Upload any xlsx/csv/ods as a new Zoho Sheet workbook: task zoho:sheet:upload -- <file> [--name <name>]"
    cmds:
      - python zoho_sheet.py --upload {{.CLI_ARGS}}

  budget:
    desc: Monarch budget and goal tracker
    cmds:
      - python monarch_budget.py {{.CLI_ARGS}}

  health:
    desc: Weekly financial health check (all checks)
    cmds:
      - python weekly_health.py {{.CLI_ARGS}}

  health:email:
    desc: Email weekly financial health report
    cmds:
      - python weekly_health.py --email {{.CLI_ARGS}}

  health:preview:
    desc: Preview weekly health report as HTML
    cmds:
      - python weekly_health.py --dry-run

  health:schedule:
    desc: "Install the launchd agent that emails the weekly health report (daily 08:00 + login trigger, sends once per 6 days)"
    cmds:
      - cp launchd/com.jamal.finance-health.plist ~/Library/LaunchAgents/com.jamal.finance-health.plist
      - launchctl unload ~/Library/LaunchAgents/com.jamal.finance-health.plist 2>/dev/null || true
      - launchctl load ~/Library/LaunchAgents/com.jamal.finance-health.plist
      - 'echo "Installed com.jamal.finance-health (daily 08:00 + at login; weekly guard). Log: ~/Library/Logs/finance-health.log"'

  health:unschedule:
    desc: Remove the weekly health launchd agent
    cmds:
      - launchctl unload ~/Library/LaunchAgents/com.jamal.finance-health.plist 2>/dev/null || true
      - rm -f ~/Library/LaunchAgents/com.jamal.finance-health.plist
      - echo "Removed com.jamal.finance-health"

  rewards:
    desc: "Credit card rewards: earn, statement credits, balance check (pulls Monarch, saves snapshot)"
    cmds:
      - python rewards.py {{.CLI_ARGS}}

  rewards:offline:
    desc: "Rewards report from the last snapshot -- deterministic, no network"
    cmds:
      - python rewards.py --offline {{.CLI_ARGS}}

  rewards:amex:
    desc: "Rewards report for the Amex Platinum only"
    cmds:
      - python rewards.py --card amex-platinum-2004 {{.CLI_ARGS}}

  rewards:json:
    desc: "Rewards report as JSON from the last snapshot"
    cmds:
      - python rewards.py --offline --json {{.CLI_ARGS}}

  rewards:test:
    desc: "Unit tests for the rewards calculator (no network)"
    cmds:
      - python -m pytest tests/test_rewards.py -q

  test:
    desc: Run integration tests (requires valid .env credentials)
    cmds:
      - python -m pytest test_integration.py -v
