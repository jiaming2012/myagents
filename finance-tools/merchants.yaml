# Merchant -> Xero account-code mapping for mercury_precode.py
# (same pattern as payments.yaml: one YAML, edit freely, script re-reads each run)
#
# Matching: `pattern` is a case-insensitive substring tested against the Mercury
# counterparty name, falling back to the bank description. First match wins,
# in order: skip -> transfers -> merchants. Unmatched transactions are never
# posted -- they land in the dry-run review list.

# Todoist project the weekly agent files action tasks into ("Bookkeeping")
todoist_project_id: "6hXPPX7qRMJpfg49"

# Mercury accounts to pre-code, each mapped to its Xero bank account.
# Order matters a little: list 4613 first so internal transfers are created
# from its side and the other accounts' sides dedup against them.
accounts:
  - mercury_account_id: "9553aae6-abe5-11ed-99c1-97cfb7de9b47"   # Mercury Checking ..4613
    xero_bank_account: "Mercury: Operations (4613)"
  - mercury_account_id: "739dbde6-ad85-11ed-9df0-fb27d7a74c22"   # Mercury Checking ..5396
    xero_bank_account: "Mercury: Outgoing ACH (5396)"
  - mercury_account_id: "955515ac-abe5-11ed-99c4-5322552875b7"   # Mercury Savings ..7818
    xero_bank_account: "Mercury: Profit (7818)"

# Never touched by this script
skip:
  - pattern: TOAST
    direction: credit          # Toast payouts are posted by toast_xero `task apply`
    reason: handled by toast_xero

# Mercury counterparties that are our own accounts -> Xero BankTransfer
# (value must exactly match the Xero bank account name). Internal transfers
# surface under user-set nicknames ("Taxes ••7818"), so match the ••suffix.
transfers:
  "••4613": "Mercury: Operations (4613)"
  "••7818": "Mercury: Profit (7818)"
  "••5396": "Mercury: Outgoing ACH (5396)"
  "••0551": "Mercury: Operations (0551) * Closed"
  "Yumyums Kitchen LLC": "BoA: Business Checking (1778)"   # Send Money wires to own BoA

merchants:
