# Accounts reconciled in Zoho Books only (NOT by mercury_precode.py / Xero).
# No bank feed: zoho_books_recon.py imports the Mercury history as a statement.
zoho_only_accounts:
  - mercury_account_id: "fdb782d6-ddbc-11f0-84d7-eb66a2192bf9"   # Mercury Checking ..0551, archived 2026-06-02
    xero_bank_account: "Mercury: Operations (0551) * Closed"
    statement_import: true
    closed: "2026-06-02"

# --- Bank of America: Zoho feed only (`task zoho:boa`), no bank API ---------------
# The feed is the data; the independent check is the monthly statement closing
# balance in closing_balances.yaml. Lines are classified on payee + description:
# boa_transfers -> boa_merchants -> the shared merchants: block above.
zoho_feed_only_accounts:
  - xero_bank_account: "BoA: Business Checking (1778)"   # Zoho "Business Adv Fundamentals" 1622286000000143048
    kind: bank
  - xero_bank_account: "BoA: CORP Account (2119)"         # Zoho "CORP Account - ... - 2119" 1622286000000143054
    kind: credit_card
  - xero_bank_account: "Bluevine: Checking * Closed"      # Zoho "Bluevine Checking ••2189 (closed)" 1622286000000207062, feed-linked 2026-10-17
    kind: bank
    closed: "2026-06-02"
  - xero_bank_account: "Chase: Ink (7667)"                # Zoho "Chase Ink ••7667" 1622286000000212046; closed card, 2026 activity imported from the statements 2026-10-17
    kind: credit_card
    no_rules: true                                        # no feed, nothing new arrives
  - xero_bank_account: "LFCU: Checking"                   # Zoho "LFCU Business Checking ••7011" 1622286000000207096, feed-linked 2026-10-17
    kind: bank
    opened: "2026-03-04"                                  # no reconciliation records before this
  - xero_bank_account: "LFCU: Savings"                    # Zoho "LFCU Share Savings ••3617" 1622286000000207090
    kind: bank
    opened: "2026-03-04"
  - xero_bank_account: "Wells: Signify Business (4637)"   # Zoho 1622286000000207157, feed-linked 2026-10-17; never used (operator), 0 lines
    kind: credit_card

# description substring -> the other account of the transfer (Xero bank name)
boa_transfers:
  "payment to CRD 2119":          "BoA: CORP Account (2119)"          # checking -> card (online payment)
  "BUSINESS CARD Bill Payment":   "BoA: CORP Account (2119)"          # checking -> card (autopay)
  "OVERDRAFT PROTECTION FROM":    "BoA: CORP Account (2119)"          # card ..445819 funds the checking overdraft
  "PAYMENT - THANK YOU":          "BoA: Business Checking (1778)"     # card side of the autopay
  "PAYMENT FROM CHK 1":           "BoA: Business Checking (1778)"     # card side of the online payment
  "OVERDRAFT ADVANCE":            "BoA: Business Checking (1778)"     # card side of the overdraft pull
  # other own accounts with no feed in Zoho (created by the script, kind in BANK_TYPES)
  "CHASE CREDIT CRD":             "Chase: Ink (7667)"                 # autopay of the Chase Ink business card (operator 2026-10-17: a liability)
  "DES:Bluevine":                 "Bluevine: Checking * Closed"       # BoA side: transfer out of the closed Bluevine checking (operator 2026-10-17)
  "Transfer to Bank of Ame":      "BoA: Business Checking (1778)"     # Bluevine side of the same transfer
  "AUTOMATIC PAYMENT - THANK YOU": "BoA: Business Checking (1778)"    # Chase side of the autopay
  "Payment Thank You":            "BoA: Business Checking (1778)"     # Chase side of the retried autopay
  "Returned Payment":             "BoA: Business Checking (1778)"     # Chase side of a bounced autopay (BoA: RETURN OF POSTED CHECK)
  # Lafayette FCU: S 0000 = share savings, S 0001 = business checking; *****0621 is the owner's personal LFCU account
  "Transfer From S 0000":         "LFCU: Savings"                     # checking side: savings -> checking (incl. overdraft transfer)
  "Transfer To S 0001":           "LFCU: Checking"                    # savings side of the same

