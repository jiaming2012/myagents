# Merchant -> chart-of-accounts code mapping for zoho_books_recon.py (Zoho Books)
# (same pattern as payments.yaml: one YAML, edit freely, script re-reads each run)
#
# Matching: `pattern` is a case-insensitive substring tested against the Mercury
# counterparty name, falling back to the bank description. First match wins,
# in order: skip -> transfers -> merchants. Unmatched transactions are never
# posted -- they land in the dry-run review list.
#
# `vendor`: the Zoho Books vendor (contact) an expense is recorded against, so the
# Expenses by Vendor report works. The script creates missing vendors by name on
# apply, sets the vendor on every new expense and bank rule, and `--vendors`
# backfills expenses that still have none. Several patterns may share one vendor
# (OnPay, Google Ads). Equity and income codes (3xxx/4xxx) take no vendor.

# Mercury accounts to reconcile, each with the short bank name used throughout this
# file (BANK_NAMES in zoho_books_recon.py maps it to the Zoho Books account name).
# Order matters a little: list 4613 first so internal transfers are created
# from its side and the other accounts' sides dedup against them.
accounts:
  - mercury_account_id: "9553aae6-abe5-11ed-99c1-97cfb7de9b47"   # Mercury Checking ..4613
    bank_account: "Mercury: Operations (4613)"
  - mercury_account_id: "739dbde6-ad85-11ed-9df0-fb27d7a74c22"   # Mercury Checking ..5396
    bank_account: "Mercury: Outgoing ACH (5396)"
  - mercury_account_id: "955515ac-abe5-11ed-99c4-5322552875b7"   # Mercury Savings ..7818
    bank_account: "Mercury: Profit (7818)"

# Never touched by this script
skip:
  - pattern: TOAST
    direction: credit          # Toast payouts are posted as split journals from the toast_xero dump
    reason: handled by the Toast journal step

# Mercury counterparties that are our own accounts -> internal transfer
# (value must exactly match a `bank_account` short name in this file). Internal transfers
# surface under user-set nicknames ("Taxes ••7818"), so match the ••suffix.
transfers:
  "••4613": "Mercury: Operations (4613)"
  "••7818": "Mercury: Profit (7818)"
  "••5396": "Mercury: Outgoing ACH (5396)"
  "••0551": "Mercury: Operations (0551) * Closed"
  "Yumyums Kitchen LLC": "BoA: Business Checking (1778)"   # Send Money wires to own BoA

