# Mercury accounts with no bank feed in Zoho Books.
# No bank feed: zoho_books_recon.py imports the Mercury history as a statement.
zoho_only_accounts:
  - mercury_account_id: "fdb782d6-ddbc-11f0-84d7-eb66a2192bf9"   # Mercury Checking ..0551, archived 2026-06-02
    bank_account: "Mercury: Operations (0551) * Closed"
    statement_import: true
    closed: "2026-06-02"

# --- Bank of America: Zoho feed only (`task zoho:feed`), no bank API ---------------
# The feed is the data; the independent check is the monthly statement closing
# balance in closing_balances.yaml. Lines are classified on payee + description:
# boa_transfers -> boa_merchants -> the shared merchants: block above.
zoho_feed_only_accounts:
  - bank_account: "BoA: Business Checking (1778)"   # Zoho "Business Adv Fundamentals" 1622286000000143048
    kind: bank
  - bank_account: "BoA: CORP Account (2119)"         # Zoho "CORP Account - ... - 2119" 1622286000000143054
    kind: credit_card
  - bank_account: "Bluevine: Checking * Closed"      # Zoho "Bluevine Checking ••2189 (closed)" 1622286000000207062, feed-linked 2026-10-17
    kind: bank
    closed: "2026-06-02"
  - bank_account: "Chase: Ink (7667)"                # Zoho "Chase Ink ••7667" 1622286000000212046; closed card, 2026 activity imported from the statements 2026-10-17
    kind: credit_card
    no_rules: true                                        # no feed, nothing new arrives
  - bank_account: "LFCU: Checking"                   # Zoho "LFCU Business Checking ••7011" 1622286000000207096, feed-linked 2026-10-17
    kind: bank
    opened: "2026-03-04"                                  # no reconciliation records before this
  - bank_account: "LFCU: Savings"                    # Zoho "LFCU Share Savings ••3617" 1622286000000207090
    kind: bank
    opened: "2026-03-04"
  - bank_account: "Wells: Signify Business (4637)"   # Zoho 1622286000000207157, feed-linked 2026-10-17; never used (operator), 0 lines
    kind: credit_card

