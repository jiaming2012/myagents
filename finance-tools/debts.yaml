# Debt paydown inputs for debt_plan.py (`task finance:debt`).
#
# Balances are never typed here: they come live from Monarch (personal) and Zoho
# Books (business) through the registry's monarch_match / zoho_match. This file adds
# what those sources do not know: APR, the minimum payment, which account the
# payment leaves from, and whether a card is carried or paid in full.
#
# Each entry:
#   account:         registry id from payments.yaml (type credit or loan)
#   apr:             annual rate in percent. Omit -> ASSUMED (cards 24.99, loans 9.99) and flagged.
#   min_payment:     monthly minimum. Omit -> the registry payment that pays this account
#                    (autopay_type: min, or a loan instalment), else 2% of balance.
#   funding_account: registry id the payment leaves from. Omit -> from the registry payment.
#   carried:         true to put a paid-in-full card into the paydown anyway (it revolves),
#                    false to leave a debt out of the plan.
#   notes:           anything the plan should print.
#
# plan:
#   strategy:        avalanche (highest APR first) | snowball (smallest balance first)
#   monthly_extra:   the extra you commit every month on top of minimums; `--monthly-extra`
#                    overrides for one run; `--by YYYY-MM` solves for it.

plan:
  strategy: avalanche
  monthly_extra: 0

debts:
  # --- business ---
  - account: chase-ink-7667
    apr: 23.6              # derived: $113.18 interest on ~$5,760 (Sep 2026 statement) x 12
    min_payment: 170       # autopay observed Jan-Oct 2026: $163-$179
    funding_account: boa-business-1778   # Zoho "Business Adv Fundamentals"; ASSUMED = registry 1778
    notes: "Card closed; paying down only. Autopay bounced Mar/Jul/Sep 2026 — keep the funding account above $170 by the 9th."

  - account: boa-corp-2119
    # apr: fill in from the statement
    # min_payment: fill in
    funding_account: boa-business-1778

  # --- personal (minimum-payment cards and loans) ---
  - account: boa-plat1-5153
    # apr: fill in
    # min_payment: 137 comes from the registry autopay entry
  - account: boa-plat2-7250
    # apr: fill in
  - account: truist-auto-1001
    # apr: fill in from the loan statement (instalment $702.91 is in the registry)
  - account: lafayette-loan-0621
    # apr: fill in (instalment $615.64 is in the registry)

  # --- personal cards paid in full monthly ---
  # These are left out of the paydown automatically because their registry payment is
  # autopay_type: full. If one starts revolving, add it here with carried: true and its APR.
  # - account: wells-autograph-8694
  #   carried: true
  #   apr: 28.49
